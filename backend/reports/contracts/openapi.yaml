openapi: 3.0.3
info:
  title: Farol Reports
  version: 0.2.0
  description: >-
    Help requests, their AI triage and the field tasks of the Sprint B stories (API outline §4, US-23 to
    US-36). Written by hand (contract-first, SDD rule R3). Every operation except the diagnostic status
    needs a Keycloak access token with audience farol-api (ADR-006); the caller is the token's sub.
    Authorisation is per event, from Reports' local copies of memberships and teams: a non-member, or a
    member who may not see a resource, gets 404 without learning whether it exists; a member without the
    permission for an action gets 403. Operations marked `x-farol-status: planned` are the target of their
    story and are not served yet (Docs/specs/194-reports-postgres-outbox.md, D11).
servers:
  - url: /
tags:
  - name: Help requests
  - name: Field tasks
  - name: Diagnostics
security:
  - bearer: []
paths:
  /api/v1/status:
    get:
      tags: [Diagnostics]
      operationId: getServiceStatus
      summary: Confirm that the Reports HTTP service is running
      security: []
      x-farol-status: implemented
      responses:
        '200':
          description: Reports is responding; this does not check external dependencies.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [service, status]
                properties:
                  service:
                    type: string
                    enum: [reports]
                  status:
                    type: string
                    enum: [ok]

  /api/v1/events/{eventId}/help-requests:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [Help requests]
      operationId: submitHelpRequest
      summary: Ask for help with a short description and a point on the map (US-23, US-25)
      description: >-
        Requires an active membership of the event. Saved with status Submitted and triage Pending, and
        HelpRequestSubmitted is written to the outbox in the same transaction. Sending the same
        clientRequestId again returns the request already saved (200) and publishes nothing new; sending it
        with another description or location is refused (409), so a reused id never drops a request.
        Planned with US-23: 422 when the event is closed or suspended or the map version does not exist.
        After 5 help requests of the account in 10 minutes, in any event, Reports answers 429 with
        Retry-After (ADR-013 L-2, enforced by Reports since 24 November 2026, spec US-23): only saved requests
        count, so a retry with the same clientRequestId is answered at the limit and uses nothing up.
      x-farol-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitHelpRequest'
      responses:
        '201':
          description: Saved.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestForParticipant'
        '200':
          description: A retry with the same clientRequestId; the request already saved.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpRequestForParticipant'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Help requests]
      operationId: listHelpRequests
      summary: Live list of the requests the caller may see (US-24, US-26, US-27, US-31)
      description: >-
        Implemented (US-26): a member with HelpRequests.Triage gets every request of the event in the
        control-room view; a member without it gets 403. Without updatedSince, every request that is not
        Closed; with it, every request changed after it, Closed ones included so the page drops them, and a
        request whose triage turned NotTriaged after it; after a team change of the event, every request that
        is not Closed too, so its defaultTeamId is current (US-34 #81). In order of arrival. serverTime is 5 s before
        the server's time, so consecutive polls overlap and a request can come twice: keep one row per id.
        Poll every 2 s while the page is visible (SC2, spec US-26 D7).
        Implemented (US-24): with mine=true, any active member gets their own requests of the event in the
        participant view, whatever their permissions (spec US-24 D1). Without updatedSince, every own
        request, Closed ones included; with it, every own request changed after it. Same serverTime
        overlap. Poll every 3 s while the request screen is open (spec US-24 D5).
        Planned: the requests routed to the caller's teams with HelpRequests.Respond (US-31); the filters
        status and teamId (US-27, US-31). Until then those parameters are ignored.
      x-farol-status: implemented
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
        - name: mine
          in: query
          description: >-
            true: only the caller's own requests, in the participant view (US-24). false or absent: the
            control-room list.
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          description: Planned (US-27, US-31); ignored for now.
          schema:
            $ref: '#/components/schemas/HelpRequestStatus'
        - name: teamId
          in: query
          description: Planned (US-31); ignored for now.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requests changed since updatedSince, and the serverTime to send next time.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, serverTime]
                properties:
                  items:
                    type: array
                    description: >-
                      Control-room items without mine (US-26); participant items with mine=true (US-24). One
                      answer has only one kind.
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/HelpRequestForControlRoom'
                        - $ref: '#/components/schemas/HelpRequestForParticipant'
                  serverTime:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events/{eventId}/help-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Help requests]
      operationId: getHelpRequest
      summary: One request (US-24, US-29, US-34)
      description: >-
        The owner gets the participant view. A member with HelpRequests.Triage gets the control-room view,
        where triage.state reads NotTriaged when the request is still Pending 30 s after submission
        (decision 6 of 15 November 2026). Planned: members of the team the request is routed to (US-31).
      x-farol-status: implemented
      responses:
        '200':
          description: The request as the caller may see it.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/HelpRequestForParticipant'
                  - $ref: '#/components/schemas/HelpRequestForControlRoom'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Help requests]
      operationId: setHelpRequestCategoryAndPriority
      summary: Set the category and the priority, either or both (US-28, US-35)
      description: >-
        Requires HelpRequests.Triage. The member's values make the triage Changed, from any triage state; the
        suggestion and the NotTriaged reason stay visible, and a suggestion that arrives later is discarded
        (NFR-22). Each changed field is recorded with who, when, the old and the new value (the history entries
        of US-28); a change to the values the request already has records nothing, whatever the triage state.
        At least one of the two is required, and neither may be null. Implemented by US-35 (#82, spec D2, D3). The
        status is not set here: the control room changes it through acknowledge (US-28) and close (US-30), spec
        US-28 D1. 409 when the request is Closed (spec US-30 D2).
      x-farol-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                category:
                  $ref: '#/components/schemas/Category'
                priority:
                  $ref: '#/components/schemas/Priority'
      responses:
        '200':
          $ref: '#/components/responses/ControlRoomView'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/events/{eventId}/help-requests/{requestId}/acknowledge:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Help requests]
      operationId: acknowledgeHelpRequest
      summary: Mark the request Seen (US-28)
      description: >-
        Requires HelpRequests.Triage. Submitted becomes Seen, whatever the triage state, recorded as a status history
        entry with who and when (US-28 #75, spec D2). 409 when the request is no longer Submitted. Not idempotent: a
        retry after a lost response also gets 409, with the same detail as when another member acknowledged it
        first, so the web app can treat a 409 here as benign and read the request again.
      x-farol-status: implemented
      responses:
        '200':
          $ref: '#/components/responses/ControlRoomView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/events/{eventId}/help-requests/{requestId}/route:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Help requests]
      operationId: routeHelpRequest
      summary: Route the request to a team; creates a field task and keeps the status (US-29)
      description: >-
        Requires HelpRequests.Triage. The team must be a team of the event, not deleted, with
        HelpRequests.Respond; it need not handle the request's category (routing by hand). An unknown team,
        another event's, a deleted one or one without HelpRequests.Respond all get the same 422. Allowed while
        the request is Submitted or Seen, that is while its field task is still Open: routedTeamId is set, the
        status is kept, a routedTeamId history entry records the member, and an Assist field task, Open, is
        dispatched to the team; routing to another team cancels the Open task first. Routing to the team it
        already has writes nothing. 409 once a member accepted the task (OnTheWay), and when it is Resolved or
        Closed (US-29 #76, spec D1 to D3).
      x-farol-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teamId]
              properties:
                teamId:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/ControlRoomView'
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /api/v1/events/{eventId}/help-requests/{requestId}/accept-suggestion:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Help requests]
      operationId: acceptTriageSuggestion
      summary: Take the AI's category and priority as the request's values (US-35)
      description: >-
        Requires HelpRequests.Triage. The request's category and priority become the suggested ones and the
        triage becomes Accepted, recorded as the member's decision (category, priority and triage history
        entries). 409 when the triage is not Suggested: no suggestion yet, NotTriaged, or a member already
        accepted or set the values (NFR-22), or the request is Closed (spec US-30 D2). The default team follows
        from the category (US-34 #81 AC-2).
      x-farol-status: implemented
      responses:
        '200':
          $ref: '#/components/responses/ControlRoomView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/events/{eventId}/help-requests/{requestId}/close:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Help requests]
      operationId: closeHelpRequest
      summary: Close the request; it leaves the active list (US-30)
      description: >-
        Requires HelpRequests.Triage. Submitted, Seen, OnTheWay or Resolved becomes Closed, whatever the triage state,
        recorded as a status history entry with who and when (US-30 #77, spec D1). The request leaves the first load
        of the control room's live list and is sent once, Closed, in the next poll; the participant keeps it, Closed.
        No body. 409 when it is already Closed, with the same detail after a retry as when another member closed it
        first. A closed request is final: acknowledge, accept-suggestion and the PATCH answer 409, and an AI result that
        arrives after the close is not written (spec D2). The request's live field task, if any, is cancelled in the
        same transaction (US-29 #76, spec D7, proposed for the team's review).
      x-farol-status: implemented
      responses:
        '200':
          $ref: '#/components/responses/ControlRoomView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/events/{eventId}/help-requests/{requestId}/history:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Help requests]
      operationId: getHelpRequestHistory
      summary: Full change history of the request (US-28)
      description: >-
        Requires HelpRequests.Triage. Every change a member made, oldest first: the category, priority and triage
        decisions of US-35, the status of acknowledge (US-28 #75, spec D4, D6) and the routedTeamId of a route
        (US-29 #76). Empty items for a request nobody changed.
      x-farol-status: implemented
      responses:
        '200':
          description: Every change, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [field, oldValue, newValue, actorUserId, actorName, changedAt]
                      properties:
                        field:
                          type: string
                          enum: [category, priority, status, routedTeamId, triage]
                        oldValue:
                          type: string
                          nullable: true
                        newValue:
                          type: string
                          nullable: true
                        actorUserId:
                          type: string
                          description: >-
                            The sub of the member who changed it. Only a member's change is an entry (spec
                            US-28 D6), so it is never empty.
                        actorName:
                          type: string
                          nullable: true
                          description: >-
                            The name claim of their token when the change was recorded (spec US-28 D5); null when the
                            token had none. Plain text, escaped when shown.
                        changedAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events/{eventId}/triage-status:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Help requests]
      operationId: getTriageStatus
      summary: Whether the AI triage is available, for the banner of scenario D1 (US-36)
      description: >-
        Requires HelpRequests.Triage. One AI serves every event, so the answer is the same for every event.
        `available` is true only when an AI is configured and its circuit breaker is closed; otherwise `reason` is
        `Unavailable` (no AI configured, or no failure to tell) or the reason of the last failed call (spec US-36 D4).
        After the circuit's open time it stays unavailable until the next request's trial call succeeds. The web app polls it
        with the live list, every 2 s while the page is visible (spec US-36 D6).
      x-farol-status: implemented
      responses:
        '200':
          description: The triage availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available, reason, checkedAt]
                properties:
                  available:
                    type: boolean
                  reason:
                    description: Null when available.
                    allOf: [{$ref: '#/components/schemas/NotTriagedReason'}]
                    nullable: true
                  checkedAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events/{eventId}/field-tasks:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [Field tasks]
      operationId: listFieldTasks
      summary: Live list of the tasks of my teams (US-31)
      description: Requires HelpRequests.Respond in at least one team of the event.
      x-farol-status: planned
      parameters:
        - $ref: '#/components/parameters/UpdatedSince'
      responses:
        '200':
          description: The tasks changed since updatedSince, and the serverTime to send next time.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, serverTime]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldTask'
                  serverTime:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/Invalid'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/events/{eventId}/field-tasks/{taskId}/accept:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Field tasks]
      operationId: acceptFieldTask
      summary: Accept a task; the help request becomes OnTheWay (US-32)
      description: Member of the task's team. 409 when another member already accepted it.
      x-farol-status: planned
      responses:
        '200':
          $ref: '#/components/responses/FieldTaskView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/events/{eventId}/field-tasks/{taskId}/resolve:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Field tasks]
      operationId: resolveFieldTask
      summary: Mark the help request resolved (US-33)
      description: Only the member who accepted the task. 409 when the task is not Accepted.
      x-farol-status: planned
      responses:
        '200':
          $ref: '#/components/responses/FieldTaskView'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token of the farol realm, audience farol-api (ADR-006).

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UpdatedSince:
      name: updatedSince
      in: query
      description: >-
        Only what changed after this time (API outline §1.6). When absent, the first load the operation
        describes (for the control room's help requests, every request that is not Closed; with mine=true,
        every own request).
      schema:
        type: string
        format: date-time

  responses:
    ControlRoomView:
      description: The request after the change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HelpRequestForControlRoom'
    FieldTaskView:
      description: The task after the change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FieldTask'
    Invalid:
      description: Malformed body, unknown field, value out of bounds or malformed id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No token, or a token that is expired, badly signed, or for another issuer or audience.
    Forbidden:
      description: A member of the event without the permission this action needs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not a member of the event, or no such resource visible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The resource is not in a state that allows this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: The event is closed or suspended, or the referenced team or map version cannot be used.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: >-
        The account already sent the most help requests the window allows (ADR-013 L-2, spec US-23 D4);
        nothing is saved. Retry-After is the whole number of seconds, at least 1, until it can ask again.
        The gateway's own limit (L-1) answers 429 the same way.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Category:
      type: string
      description: Decision 8 of the meeting of 15 November 2026.
      enum: [Health, Safety, LostPerson, Infrastructure, Other]
    Priority:
      type: string
      description: Decision 2 of the meeting of 15 November 2026.
      enum: [Low, Medium, High, Critical]
    HelpRequestStatus:
      type: string
      description: 'Decision 6 of the meeting of 15 November 2026 (#177): Submitted, Seen, OnTheWay, Resolved, Closed.'
      enum: [Submitted, Seen, OnTheWay, Resolved, Closed]
    TriageState:
      type: string
      enum: [Pending, Suggested, NotTriaged, Accepted, Changed]
    NotTriagedReason:
      type: string
      enum: [Timeout, ProviderError, InvalidOutput, Abstained, Unavailable]
    Location:
      type: object
      additionalProperties: false
      required: [mapVersion, x, y]
      description: A normalised point on one version of the event's venue map.
      properties:
        mapVersion:
          type: integer
          minimum: 1
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
    SubmitHelpRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, location, description]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Generated by the app; makes a retry safe (US-25). Reusing it for another request gets 409.
        location:
          $ref: '#/components/schemas/Location'
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: Required, not blank (assessment M-2); 500 characters at most, counted as Unicode code points.
      example:
        clientRequestId: 6f1c2b9e-3c1d-4e0a-9d6f-3a1b2c3d4e5f
        location: {mapVersion: 3, x: 0.42, y: 0.77}
        description: Friend fainted near the bar
    HelpRequestForParticipant:
      type: object
      additionalProperties: false
      required: [id, description, status, updatedAt]
      description: >-
        What the participant sees; never a category or a priority (US-24). updatedAt is the time of the last
        change of the request, of any field (spec US-24 D3). Statuses shown as Sent (Submitted), Seen,
        On the way (OnTheWay), Resolved and Closed (spec US-24 D7).
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        status:
          $ref: '#/components/schemas/HelpRequestStatus'
        updatedAt:
          type: string
          format: date-time
    HelpRequestForControlRoom:
      type: object
      additionalProperties: false
      required: [id, eventId, category, location, description, priority, status, submittedAt, updatedAt,
        defaultTeamId, routedTeamId, triage]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        category:
          allOf: [{$ref: '#/components/schemas/Category'}]
          nullable: true
          description: Null until the AI suggestion is accepted or a member sets it.
        location:
          $ref: '#/components/schemas/Location'
        description:
          type: string
        priority:
          allOf: [{$ref: '#/components/schemas/Priority'}]
          nullable: true
        status:
          $ref: '#/components/schemas/HelpRequestStatus'
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        defaultTeamId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The event's team that handles the category and has HelpRequests.Respond (US-34 #81 AC-2): the
            category a member set, else the AI's suggested one. Null without a category, with no such team, or
            with several (the operator routes by hand). Read from the current copy of the event's teams, never
            chosen by the AI and not stored. A poll with updatedSince after a team change of the event lists
            every open request again, so the default team stays current.
        routedTeamId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The team the control room routed the request to (US-29 #76); null until then, and again when that
            team is deleted, which sends the request back to the queue (OnTheWay becomes Seen).
        triage:
          type: object
          additionalProperties: false
          required: [state, suggestedCategory, suggestedPriority, suggestedReason, notTriagedReason]
          properties:
            state:
              $ref: '#/components/schemas/TriageState'
            suggestedCategory:
              allOf: [{$ref: '#/components/schemas/Category'}]
              nullable: true
            suggestedPriority:
              allOf: [{$ref: '#/components/schemas/Priority'}]
              nullable: true
            suggestedReason:
              type: string
              nullable: true
              maxLength: 240
              description: Short plain text from the AI (1 to 240 characters, US-34 D9); escape it when shown (ADR-005, assessment T10). A suggestion is shown as a suggestion, never as the request's own category or priority (NFR-22).
            notTriagedReason:
              allOf: [{$ref: '#/components/schemas/NotTriagedReason'}]
              nullable: true
    FieldTask:
      type: object
      additionalProperties: false
      required: [id, purpose, status, teamId, target, acceptedBy, dispatchedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          type: string
          enum: [Assist]
          description: Verify and Fix (community reports) arrive in Sprint C.
        status:
          type: string
          enum: [Open, Accepted, Resolved, Cancelled]
        teamId:
          type: string
          format: uuid
        target:
          type: object
          additionalProperties: false
          required: [kind, id, category, location]
          properties:
            kind:
              type: string
              enum: [HelpRequest]
            id:
              type: string
              format: uuid
            category:
              allOf: [{$ref: '#/components/schemas/Category'}]
              nullable: true
            location:
              $ref: '#/components/schemas/Location'
        acceptedBy:
          type: string
          nullable: true
        dispatchedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
