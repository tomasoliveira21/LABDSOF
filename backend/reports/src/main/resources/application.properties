# The handwritten contract is authoritative; do not generate a competing API spec.
springdoc.enable-default-api-docs=false
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
# Keep validation local; do not send the specification to an external validator.
springdoc.swagger-ui.validator-url=

# Reject fields outside the documented create DTO (including forged identities).
spring.jackson.deserialization.fail-on-unknown-properties=true
