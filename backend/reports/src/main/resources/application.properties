# The handwritten contract is authoritative; do not generate a competing API spec.
springdoc.enable-default-api-docs=false
springdoc.swagger-ui.url=/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true
# Keep validation local; do not send the specification to an external validator.
springdoc.swagger-ui.validator-url=

# Reject fields outside the documented request bodies (including forged identities: mass assignment).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=true

# Database (ADR-003): every value comes from the environment (infra/compose.yaml, infra/.env). No default secret.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# At most 10 connections per service on the shared server (#189 handoff)
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.locations=classpath:db/migration

# RabbitMQ (ADR-004, #212): the reports user declares nothing; the topology comes from infra/rabbitmq/topology.json.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Start before rabbitmq-setup has run and consume once the queues exist (spec D9)
spring.rabbitmq.listener.simple.missing-queues-fatal=false
# 4 attempts, backoff 1 s, 2 s, 4 s, then the dead-letter queue (ADR-004 decision 3, spec D8)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=4s

# Outbox publisher (spec D5)
farol.outbox.enabled=true
farol.outbox.poll-interval=500ms
farol.outbox.batch-size=50
farol.outbox.confirm-timeout=5s

# JWT (ADR-006): public issuer checked against iss, keys from Keycloak's internal address, audience farol-api.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FAROL_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${FAROL_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.audiences=farol-api
