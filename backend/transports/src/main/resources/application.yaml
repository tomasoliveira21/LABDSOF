# Transports (spec Docs/specs/193-transports-service.md). Every secret comes from the environment
# (infra/compose.yaml, infra/.env); no default secret.
spring:
  application:
    name: transports
  mvc:
    problemdetails:
      # Problem Details for every MVC error (API outline 1.7)
      enabled: true
  jackson:
    deserialization:
      # Reject fields outside the documented bodies (mass assignment). The consumers tolerate unknown fields on
      # their own mapper (contracts evolve by adding).
      fail-on-unknown-properties: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # At most 10 connections per service on the shared server (#189 handoff)
      maximum-pool-size: 5
  flyway:
    locations: classpath:db/migration
  rabbitmq:
    # The transports user declares nothing and publishes only dead letters; the topology comes from
    # infra/rabbitmq/topology.json (#212, spec D2, D3)
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
    # A dead letter is confirmed by the broker before the original is acknowledged (spec D3, #214 D8)
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Start before rabbitmq-setup has created the queues and consume once they exist (spec D3, #214 D9)
        missing-queues-fatal: false
        # 4 attempts, backoff 1 s, 2 s, 4 s, then the dead-letter queue (spec D3, ADR-004 decision 3)
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  security:
    oauth2:
      resourceserver:
        jwt:
          # ADR-006: public issuer checked against iss, keys from Keycloak's internal address, audience farol-api
          issuer-uri: ${FAROL_ISSUER_URI}
          jwk-set-uri: ${FAROL_JWKS_URI}
          audiences: farol-api

farol:
  transport:
    # The bus source (spec D5, D7, ADR-008; values of architecture 9.1, J1). TRANSPORT_SOURCE_URL is WireMock in
    # Compose; switched on without it, start-up fails. coords is the Queimodromo, written exactly as the recorded
    # stubs match it (infra/wiremock/README.md), latitude first.
    source:
      enabled: true
      url: ${TRANSPORT_SOURCE_URL:}
      coords: "41.1724,-8.6841"
      max-distance: 2000
      interval: 30s
      connect-timeout: 3s
      read-timeout: 5s
      # US-40 D3: a bus observed longer ago than this is late and left out (ADR-008, the y of P4)
      freshness: 5m
      # US-40 D5, the values of J1 (architecture 9.1): the retry wraps the circuit breaker
      retry:
        max-attempts: 3
        first-wait: 1s
        multiplier: 2
      circuit-breaker:
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-in-open-state: 60s
        permitted-calls-in-half-open-state: 1

logging:
  structured:
    format:
      console: logstash
