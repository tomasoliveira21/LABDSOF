openapi: 3.0.3
info:
  title: Farol Transports
  version: 0.1.0
  description: >-
    The event's transport options (shuttles and external bus routes), and the bus observations imported
    from the Porto Digital urban platform (API outline §5, ADR-008). Contract-first (C7): the server
    interfaces and DTOs are generated from this file. Sprint B endpoints only (spec #193 D6); every
    operation answers 501 until its story (US-41, US-43; US-40 D9 moved the source status to US-43),
    and their request and response shapes are proposals until then. The import of the source is a
    scheduled job, never an endpoint. Every /api/v1 call needs a valid access token issued by Keycloak
    to the web app (audience farol-api);
    /api/v1/status is the only diagnostic exception.
servers:
  - url: /
tags:
  - name: Status
  - name: BusObservations
  - name: TransportSource
  - name: TransportOptions
security:
  - bearerAuth: []
paths:
  /api/v1/status:
    get:
      tags: [Status]
      operationId: getServiceStatus
      summary: Confirm that the Transports HTTP service is running
      security: []
      responses:
        '200':
          description: The service is responding; this does not check its dependencies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
  /api/v1/events/{eventId}/bus-observations:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [BusObservations]
      operationId: getBusObservations
      summary: The latest bus positions on the event's external routes (US-41, US-42); any member
      description: >-
        Only the buses on the event's external routes near the venue, with the time of the data
        (dataAsOf) and stale true when the source is down or the data is older than the freshness
        limit (5 min, ADR-008). A suspended event, or a user who is not a member, gets 404.
      responses:
        '200':
          description: The buses, possibly none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusObservations'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/events/{eventId}/transport-source-status:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [TransportSource]
      operationId: getTransportSourceStatus
      summary: Whether the Porto Digital source is available, and the last valid import (US-40, US-43)
      description: For the backoffice warning; an EventAdmin or a member with Transport.Edit.
      responses:
        '200':
          description: The state of the source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportSourceStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/events/{eventId}/transport-options:
    parameters:
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [TransportOptions]
      operationId: createTransportOption
      summary: Add a shuttle (US-37) or an external bus route (US-41); Transport.Edit
      description: >-
        A shuttle has a name, its stops and departures; an external bus route has its route reference
        (the routeId of the Porto Digital vehicles) and its stops. Stops are transport-stop points of
        interest of the event (API outline D8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTransportOption'
      responses:
        '201':
          description: The transport option
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransportOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: No permission in this event
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not a member of the event (API outline §1.7)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service:
          type: string
          enum: [transports]
        status:
          type: string
          enum: [ok]
    TransportMode:
      type: string
      description: A shuttle entered by the team, or an external bus route matched by its reference
      enum: [Shuttle, ExternalBus]
    GeoPosition:
      type: object
      additionalProperties: false
      description: Geographic coordinates of a bus, separate from the venue-map position (domain model)
      required: [longitude, latitude]
      properties:
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
    BusObservation:
      type: object
      additionalProperties: false
      required: [vehicleId, routeId, position, observedAt]
      properties:
        vehicleId:
          type: string
          description: The vehicle's id at the source
        routeId:
          type: string
        position:
          $ref: '#/components/schemas/GeoPosition'
        observedAt:
          type: string
          format: date-time
          description: When the source observed the bus, not when it was imported
    BusObservations:
      type: object
      additionalProperties: false
      required: [stale, buses]
      properties:
        dataAsOf:
          type: string
          format: date-time
          description: The time of the last valid import; absent before the first one
        stale:
          type: boolean
          description: True when the source is down or the data is older than the freshness limit
        buses:
          type: array
          items:
            $ref: '#/components/schemas/BusObservation'
    TransportSourceStatus:
      type: object
      additionalProperties: false
      required: [available]
      properties:
        available:
          type: boolean
        lastValidImportAt:
          type: string
          format: date-time
          description: Absent before the first valid import
    NewDeparture:
      type: object
      additionalProperties: false
      required: [destination, scheduledAt]
      properties:
        destination:
          type: string
          minLength: 1
          maxLength: 100
        scheduledAt:
          type: string
          format: date-time
    Departure:
      type: object
      additionalProperties: false
      required: [destination, scheduledAt]
      properties:
        destination:
          type: string
        scheduledAt:
          type: string
          format: date-time
        expectedAt:
          type: string
          format: date-time
          description: Set when the shuttle is delayed (US-38)
    NewTransportOption:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/TransportMode'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Required for a shuttle
        externalRoute:
          type: string
          minLength: 1
          maxLength: 20
          description: Required for an external bus route; the routeId of the source's vehicles
        stopPoiIds:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        departures:
          type: array
          maxItems: 50
          description: Shuttles only
          items:
            $ref: '#/components/schemas/NewDeparture'
    TransportOption:
      type: object
      additionalProperties: false
      required: [optionId, mode, stopPoiIds, departures]
      properties:
        optionId:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/TransportMode'
        name:
          type: string
        externalRoute:
          type: string
        stopPoiIds:
          type: array
          items:
            type: string
            format: uuid
        departures:
          type: array
          items:
            $ref: '#/components/schemas/Departure'
    Problem:
      type: object
      description: RFC 9457 Problem Details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
