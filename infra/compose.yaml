# Sprint A: one diagnostic service. Full application integration follows in Sprint B.
services:
  reports:
    image: farol-reports:${VERSION:-dev}
    build:
      context: ../backend/reports
    ports:
      - "127.0.0.1:${REPORTS_PORT:-8080}:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/status"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
