# Sprint B base (#202): web app, RabbitMQ, API gateway and the five service skeletons.
# #189: PostgreSQL (six databases, one owner each) and Keycloak with the farol realm.
# Values come from infra/.env (copy infra/.env.example once); a missing one stops `up` with its name.
# Everything published is bound to 127.0.0.1: the demo runs only on the laptop (meeting of 15 Nov 2026, decision 10).

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

x-spring: &spring
  <<: *hardening
  environment:
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  mem_limit: 512m
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/status"]
    interval: 5s
    timeout: 3s
    start_period: 30s
    retries: 12

services:
  gateway:
    <<: *spring
    image: farol-gateway:${VERSION:-dev}
    build:
      context: ../backend/gateway
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      FAROL_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}/realms/farol
      FAROL_JWKS_URI: http://keycloak:8080/realms/farol/protocol/openid-connect/certs
      FAROL_GATEWAY_ALLOWED_ORIGINS: ${FAROL_GATEWAY_ALLOWED_ORIGINS:-http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-3000},http://localhost:5173}
      FAROL_GATEWAY_REQUESTS_PER_MINUTE: ${FAROL_GATEWAY_REQUESTS_PER_MINUTE:-120}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  auth-users:
    <<: *spring
    image: farol-auth-users:${VERSION:-dev}
    build:
      context: ../backend/auth-users
    # #191: its own database (Flyway at start-up, so it waits for PostgreSQL), RabbitMQ as the `auth-users` user
    # (it does not wait for the broker: the outbox keeps events until it is reachable, ADR-011) and Keycloak
    # (keys fetched at the first token, so it does not wait for Keycloak either).
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0" # repeated: `environment` replaces the anchor's
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_users
      SPRING_DATASOURCE_USERNAME: auth_users
      SPRING_DATASOURCE_PASSWORD: ${AUTH_USERS_DB_PASSWORD:?set AUTH_USERS_DB_PASSWORD in infra/.env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: auth-users
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_AUTH_USERS_PASSWORD:?set RABBITMQ_AUTH_USERS_PASSWORD in infra/.env}
      FAROL_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}/realms/farol
      FAROL_JWKS_URI: http://keycloak:8080/realms/farol/protocol/openid-connect/certs
      # The account that becomes the first FarolAdmin once its e-mail is verified (#179). Optional: an empty value
      # grants nobody (spec D6), so it must not be `:?`, which fails interpolation for an empty value as well
      FAROL_BOOTSTRAP_FAROL_ADMIN_EMAIL: ${FAROL_BOOTSTRAP_FAROL_ADMIN_EMAIL:-}

  events:
    <<: *spring
    image: farol-events:${VERSION:-dev}
    build:
      context: ../backend/events
    # #192: its own database (Flyway at start-up, so it waits for PostgreSQL), RabbitMQ as the `events` user (it
    # waits for neither the broker nor its queue: the listener keeps retrying until rabbitmq-setup has run, and the
    # outbox keeps events until the broker accepts them, ADR-011) and Keycloak (keys fetched at the first token).
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0" # repeated: `environment` replaces the anchor's
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/events
      SPRING_DATASOURCE_USERNAME: events
      SPRING_DATASOURCE_PASSWORD: ${EVENTS_DB_PASSWORD:?set EVENTS_DB_PASSWORD in infra/.env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: events
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_EVENTS_PASSWORD:?set RABBITMQ_EVENTS_PASSWORD in infra/.env}
      FAROL_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}/realms/farol
      FAROL_JWKS_URI: http://keycloak:8080/realms/farol/protocol/openid-connect/certs

  reports:
    <<: *spring
    image: farol-reports:${VERSION:-dev}
    build:
      context: ../backend/reports
    # #194: its own database (Flyway at start-up, so it waits for PostgreSQL), RabbitMQ as the `reports` user
    # (it does not wait for the broker: the outbox keeps events until it is reachable, ADR-011) and Keycloak.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reports
      SPRING_DATASOURCE_USERNAME: reports
      SPRING_DATASOURCE_PASSWORD: ${REPORTS_DB_PASSWORD:?set REPORTS_DB_PASSWORD in infra/.env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: reports
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_REPORTS_PASSWORD:?set RABBITMQ_REPORTS_PASSWORD in infra/.env}
      FAROL_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}/realms/farol
      FAROL_JWKS_URI: http://keycloak:8080/realms/farol/protocol/openid-connect/certs
      # US-34 (spec D7, D10): empty by default, so CI and the default stack never call or download a model
      FAROL_AI_URL: ${FAROL_AI_URL:-}

  # US-34 (spec D10): the local model, opt-in (--profile ai); same image and settings as the evaluation runs (#224,
  # #227). No published port: only Reports reaches it. Pull the model once: docker compose exec ai ollama pull qwen3:4b
  ai:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: [ai]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ai-models:/root/.ollama

  transports:
    <<: *spring
    image: farol-transports:${VERSION:-dev}
    build:
      context: ../backend/transports

  badges:
    <<: *spring
    image: farol-badges:${VERSION:-dev}
    build:
      context: ../backend/badges
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/badges
      SPRING_DATASOURCE_USERNAME: badges
      SPRING_DATASOURCE_PASSWORD: ${BADGES_DB_PASSWORD:?set BADGES_DB_PASSWORD in infra/.env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: badges
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_BADGES_PASSWORD:?set RABBITMQ_BADGES_PASSWORD in infra/.env}
      FAROL_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}/realms/farol
      FAROL_JWKS_URI: http://keycloak:8080/realms/farol/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]

  frontend:
    <<: *hardening
    image: farol-web:${VERSION:-dev}
    build:
      context: ../frontend
      args:
        VITE_KEYCLOAK_URL: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}
        VITE_GATEWAY_URL: http://${PUBLIC_HOST:-localhost}:${GATEWAY_PORT:-8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    # The web app never talks to the broker: this is only for `up --wait` (#220). `--wait` fails on any container
    # that has exited, unless another service depends on it with service_completed_successfully; then it waits
    # for it to finish with exit 0 instead. Without it, `--wait` failed whenever rabbitmq-setup finished first.
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.2.9-management-alpine@sha256:77ca2ba3621a95208918e6e331199a6c81129690bf7fc570dc61b6e64726840a
    hostname: rabbitmq # fixed node name, so the data in the volume is found again
    user: rabbitmq
    environment:
      # Created on the first start only (an empty volume); used by rabbitmq-setup and the operator, never by a service
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?set RABBITMQ_ADMIN_USER in infra/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 512m
    # ~45 processes at rest, and each CLI run (health check, rabbitmqctl) starts an Erlang VM with dozens of
    # threads: two at once went over 128 and aborted ("Failed to create poll thread", #212)
    pids_limit: 256
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  # One-shot (#212): imports infra/rabbitmq/topology.json and declares one user per service, right after the
  # broker is healthy and on every `up`. Services do not wait for it (ADR-011): they reconnect, and their outbox
  # keeps the events until the exchange exists, so no event is published before its queues exist.
  # Only `frontend` waits for it, so that `up --wait` waits for it to finish (#220).
  rabbitmq-setup:
    <<: *hardening
    image: rabbitmq:4.2.9-management-alpine@sha256:77ca2ba3621a95208918e6e331199a6c81129690bf7fc570dc61b6e64726840a
    user: rabbitmq
    entrypoint: ["/bin/sh", "/etc/farol/setup.sh"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: "no"
    environment:
      RABBITMQADMIN_USERNAME: ${RABBITMQ_ADMIN_USER:?set RABBITMQ_ADMIN_USER in infra/.env}
      RABBITMQADMIN_PASSWORD: ${RABBITMQ_ADMIN_PASSWORD:?set RABBITMQ_ADMIN_PASSWORD in infra/.env}
      RABBITMQ_AUTH_USERS_PASSWORD: ${RABBITMQ_AUTH_USERS_PASSWORD:?set RABBITMQ_AUTH_USERS_PASSWORD in infra/.env}
      RABBITMQ_EVENTS_PASSWORD: ${RABBITMQ_EVENTS_PASSWORD:?set RABBITMQ_EVENTS_PASSWORD in infra/.env}
      RABBITMQ_REPORTS_PASSWORD: ${RABBITMQ_REPORTS_PASSWORD:?set RABBITMQ_REPORTS_PASSWORD in infra/.env}
      RABBITMQ_TRANSPORTS_PASSWORD: ${RABBITMQ_TRANSPORTS_PASSWORD:?set RABBITMQ_TRANSPORTS_PASSWORD in infra/.env}
      RABBITMQ_BADGES_PASSWORD: ${RABBITMQ_BADGES_PASSWORD:?set RABBITMQ_BADGES_PASSWORD in infra/.env}
    volumes:
      - ./rabbitmq/setup.sh:/etc/farol/setup.sh:ro
      - ./rabbitmq/topology.json:/etc/farol/topology.json:ro
    mem_limit: 128m

  postgres:
    <<: *hardening
    image: postgres:18.7-alpine3.24@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    user: postgres # the image's own user (uid 70), so it needs no capability to change owners
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in infra/.env}
      POSTGRES_DB: postgres
      AUTH_USERS_DB_PASSWORD: ${AUTH_USERS_DB_PASSWORD:?set AUTH_USERS_DB_PASSWORD in infra/.env}
      EVENTS_DB_PASSWORD: ${EVENTS_DB_PASSWORD:?set EVENTS_DB_PASSWORD in infra/.env}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:?set REPORTS_DB_PASSWORD in infra/.env}
      TRANSPORTS_DB_PASSWORD: ${TRANSPORTS_DB_PASSWORD:?set TRANSPORTS_DB_PASSWORD in infra/.env}
      BADGES_DB_PASSWORD: ${BADGES_DB_PASSWORD:?set BADGES_DB_PASSWORD in infra/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/10-create-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    mem_limit: 512m
    pids_limit: 256 # one process per connection: 5 pools of 10 + Keycloak's 20, below max_connections (100)
    healthcheck:
      # TCP, not the socket: during the first start the init server listens only on the socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 12

  keycloak:
    <<: *hardening
    image: farol-keycloak:${VERSION:-dev}
    build:
      context: ./keycloak
    command: ["start", "--optimized", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/.env}
      KC_DB_POOL_MAX_SIZE: "20"
      # Production mode over plain HTTP: allowed only because the browser reaches it on localhost (ADR-006).
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true" # services fetch the keys at http://keycloak:8080; `iss` stays the public URL
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?set KEYCLOAK_ADMIN_USER in infra/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=70.0"
      # Placeholders of infra/keycloak/farol-realm.json, filled at import (security assessment, finding 8)
      FAROL_WEB_ORIGIN: http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-3000}
      FAROL_AUTH_USERS_CLIENT_SECRET: ${FAROL_AUTH_USERS_CLIENT_SECRET:?set FAROL_AUTH_USERS_CLIENT_SECRET in infra/.env}
      FAROL_BOOTSTRAP_FAROL_ADMIN_EMAIL: ${FAROL_BOOTSTRAP_FAROL_ADMIN_EMAIL:?set FAROL_BOOTSTRAP_FAROL_ADMIN_EMAIL in infra/.env}
      FAROL_DEMO_PASSWORD: ${FAROL_DEMO_PASSWORD:?set FAROL_DEMO_PASSWORD in infra/.env}
    tmpfs:
      - /tmp
      - /opt/keycloak/data:uid=1000
    volumes:
      # Imported only when the realm does not exist yet: after editing it, run `down -v`
      - ./keycloak/farol-realm.json:/opt/keycloak/data/import/farol-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080" # login pages and admin console; health stays on 9000, unpublished
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      # The image has no curl or wget: an HTTP HEAD over bash's /dev/tcp (Keycloak health guide)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.0 200' <&3"]
      interval: 5s
      timeout: 3s
      # A first start creates the master realm and imports farol: about 145 s on a busy laptop (review of #211).
      # The container still turns healthy as soon as the check passes, so a long budget costs nothing.
      start_period: 180s
      retries: 24

volumes:
  rabbitmq-data:
  postgres-data:
  ai-models:
