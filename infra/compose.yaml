# Sprint B base (#202): web app, RabbitMQ, API gateway and the five service skeletons.
# Only the gateway and the web app are published, on 127.0.0.1 until #190 adds authentication.

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "2"

x-spring: &spring
  <<: *hardening
  environment:
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
  mem_limit: 512m
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/status"]
    interval: 5s
    timeout: 3s
    start_period: 30s
    retries: 12

services:
  gateway:
    <<: *spring
    image: farol-gateway:${VERSION:-dev}
    build:
      context: ../backend/gateway
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"

  auth-users:
    <<: *spring
    image: farol-auth-users:${VERSION:-dev}
    build:
      context: ../backend/auth-users

  events:
    <<: *spring
    image: farol-events:${VERSION:-dev}
    build:
      context: ../backend/events

  reports:
    <<: *spring
    image: farol-reports:${VERSION:-dev}
    build:
      context: ../backend/reports

  transports:
    <<: *spring
    image: farol-transports:${VERSION:-dev}
    build:
      context: ../backend/transports

  badges:
    <<: *spring
    image: farol-badges:${VERSION:-dev}
    build:
      context: ../backend/badges

  frontend:
    <<: *hardening
    image: farol-web:${VERSION:-dev}
    build:
      context: ../frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4.2.9-management-alpine@sha256:77ca2ba3621a95208918e6e331199a6c81129690bf7fc570dc61b6e64726840a
    hostname: rabbitmq # fixed node name, so the data in the volume is found again
    user: rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

volumes:
  rabbitmq-data:
