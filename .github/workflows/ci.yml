name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/*/pom.xml
      - name: Build and test every module
        shell: bash
        run: |
          for module in auth-users events reports transports badges gateway; do
            mvn --batch-mode --no-transfer-progress -f "backend/$module/pom.xml" verify
          done
      # The harmless example values of infra/.env.example (ADR-010 point 6); no secret is needed in CI.
      - name: Build and start the stack
        run: docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example up --build -d --wait --wait-timeout 300
      - name: Check that each database user reaches only its own database (ADR-003)
        shell: bash
        run: |
          set -a; . infra/.env.example; set +a
          compose="docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example"
          declare -A password=([auth_users]=$AUTH_USERS_DB_PASSWORD [events]=$EVENTS_DB_PASSWORD [reports]=$REPORTS_DB_PASSWORD
                               [transports]=$TRANSPORTS_DB_PASSWORD [badges]=$BADGES_DB_PASSWORD [keycloak]=$KEYCLOAK_DB_PASSWORD)
          connect() { # user, database; over TCP with a password, as a service connects
            $compose exec -T -e PGPASSWORD="${password[$1]}" postgres psql -h postgres -U "$1" -d "$2" -tAc 'select 1' >/dev/null 2>&1
          }
          fail=0
          for user in "${!password[@]}"; do
            connect "$user" "$user" || { echo "::error::$user cannot reach its own database"; fail=1; }
            for database in "${!password[@]}" postgres template1; do
              if [ "$database" != "$user" ] && connect "$user" "$database"; then
                echo "::error::$user can reach the $database database"; fail=1
              fi
            done
          done
          exit $fail
      - name: Check the identity set-up through Keycloak (ADR-006)
        run: python3 -I infra/tests/identity_smoke.py infra/.env.example
      - name: Check that only 127.0.0.1 is published and the new containers are hardened
        shell: bash
        run: |
          compose="docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example"
          test "$($compose port keycloak 8080)" = "127.0.0.1:8180" || { echo "::error::Keycloak is not bound to 127.0.0.1:8180"; exit 1; }
          test -z "$(docker port "$($compose ps -q postgres)")" || { echo "::error::PostgreSQL is published"; exit 1; }
          for service in postgres keycloak; do
            settings=$(docker inspect "$($compose ps -q "$service")" --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}')
            test "$settings" = "true [ALL] [no-new-privileges:true]" || { echo "::error::$service hardening: $settings"; exit 1; }
          done
      - name: Check each service status through the gateway
        shell: bash
        run: |
          for service in auth-users events reports transports badges; do
            body=$(curl --fail --silent --show-error "http://127.0.0.1:8080/status/$service")
            test "$body" = "{\"service\":\"$service\",\"status\":\"ok\"}" || { echo "$service: $body"; exit 1; }
          done
      - name: Check the web app
        run: curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q "<title>Farol</title>"
      - name: Show container logs on failure
        if: failure()
        run: docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example logs --no-color --tail=100
      - name: Stop the CI stack
        if: always()
        run: docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example down --volumes --remove-orphans

  sonar:
    name: SonarQube Cloud
    # No secrets for fork or Dependabot code. Do not use pull_request_target.
    # Free-plan PR analysis targets main; tags/manual feature branches are excluded.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Check SonarQube Cloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=0
          for key in SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key. Follow Docs/Technical/sonarqube-cloud.md before enabling this check."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/reports/pom.xml
      - name: Cache SonarScanner packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build, test and generate coverage
        run: mvn --batch-mode --no-transfer-progress -f backend/reports/pom.xml verify
      - name: Verify the coverage report exists
        run: test -s backend/reports/target/site/jacoco/jacoco.xml
      - name: Analyze and wait for the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress -f backend/reports/pom.xml
          sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          "-Dsonar.organization=$SONAR_ORGANIZATION"
          "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
