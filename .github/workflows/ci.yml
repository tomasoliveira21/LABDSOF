name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/*/pom.xml
      - name: Build and test every module
        shell: bash
        run: |
          for module in auth-users events reports transports badges gateway; do
            mvn --batch-mode --no-transfer-progress -f "backend/$module/pom.xml" verify
          done
      # `up --wait` fails on an exited one-shot container unless a service depends on it with
      # service_completed_successfully (#220); no backend service may wait for the broker (ADR-011).
      - name: Check the start-up order
        run: |
          docker compose -f infra/compose.yaml --env-file infra/.env.example config --format json | python3 -I -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          anchors = sorted(name for name, s in services.items()
                           if s.get("depends_on", {}).get("rabbitmq-setup", {}).get("condition") == "service_completed_successfully")
          assert anchors == ["frontend"], f"only frontend may wait for rabbitmq-setup to complete, found {anchors}"
          waiting = sorted(name for name in ("gateway", "auth-users", "events", "reports", "transports", "badges")
                           if {"rabbitmq", "rabbitmq-setup"} & set(services[name].get("depends_on", {})))
          assert not waiting, f"these services wait for the broker: {waiting}"
          print("frontend waits for rabbitmq-setup; no backend service waits for the broker")'
      # Each service image reads its dependencies from its own Maven cache, `farol-maven-<service>` (#219). Fill them
      # with the repository the step above has just filled, so the images download nothing from Maven Central: all
      # at once, they were refused with 429 Too Many Requests (16 and 17 Nov 2026). The cache ids are read from the
      # Dockerfiles themselves, so no service can be left out of this step by mistake: a backend Dockerfile without
      # a Maven cache fails here instead of quietly downloading from Maven Central. Without `_remote.repositories`
      # the image's Maven takes each file as it is, instead of checking it again on Maven Central (the runner's Maven
      # records another repository id), and the not-found markers go too, or a dependency that failed to resolve on
      # the runner would not be tried again for 24 h. No --no-cache here or in the next step: it empties the caches.
      - name: Give the image builds the Maven dependencies
        shell: bash
        run: |
          mounts=""
          for dockerfile in backend/*/Dockerfile; do
            id=$(grep -om1 'id=farol-maven-[a-z-]*' "$dockerfile") || {
              echo "::error::$dockerfile has no Maven cache; its image would download from Maven Central (#219)"
              exit 1
            }
            mounts+=" --mount=type=cache,$id,target=/cache/${id#id=farol-maven-},sharing=locked"
          done
          printf '%s\n' 'FROM maven:3.9.9-eclipse-temurin-21-alpine@sha256:5a8b906c4faa11d33f6c74758f67db8eac25441e14b0729f6d50ff78992be58a' \
            "RUN --mount=type=bind,target=/seed$mounts for cache in /cache/*; do cp -R /seed/. \$cache/; done \
              && find /cache -name _remote.repositories -delete -o -name '*.lastUpdated' -delete && du -sh /cache/*" |
          docker build --progress=plain -f - ~/.m2/repository
      # The harmless example values of infra/.env.example (ADR-010 point 6); no secret is needed in CI.
      - name: Build and start the stack
        run: docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example up --build -d --wait --wait-timeout 300
      - name: Check that each database user reaches only its own database (ADR-003)
        shell: bash
        run: |
          set -a; . infra/.env.example; set +a
          compose="docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example"
          declare -A password=([auth_users]=$AUTH_USERS_DB_PASSWORD [events]=$EVENTS_DB_PASSWORD [reports]=$REPORTS_DB_PASSWORD
                               [transports]=$TRANSPORTS_DB_PASSWORD [badges]=$BADGES_DB_PASSWORD [keycloak]=$KEYCLOAK_DB_PASSWORD)
          connect() { # user, database; over TCP with a password, as a service connects
            $compose exec -T -e PGPASSWORD="${password[$1]}" postgres psql -h postgres -U "$1" -d "$2" -tAc 'select 1' >/dev/null 2>&1
          }
          fail=0
          for user in "${!password[@]}"; do
            connect "$user" "$user" || { echo "::error::$user cannot reach its own database"; fail=1; }
            for database in "${!password[@]}" postgres template1; do
              if [ "$database" != "$user" ] && connect "$user" "$database"; then
                echo "::error::$user can reach the $database database"; fail=1
              fi
            done
          done
          exit $fail
      - name: Check the broker topology and the service users (#212)
        shell: bash
        run: |
          compose="docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example"
          ctl="$compose exec -T rabbitmq rabbitmqctl -q"
          fail=0
          code=$(docker inspect "$($compose ps -aq rabbitmq-setup)" --format '{{.State.ExitCode}}')
          test "$code" = 0 || { echo "::error::rabbitmq-setup exited with $code"; $compose logs rabbitmq-setup; exit 1; }
          queues=$($ctl list_queues name type durable | tail -n +2 | sort)
          test "$(grep -vc '\.dlq' <<< "$queues")" = 10 || { echo "::error::expected 10 queues"; fail=1; }
          test "$(grep -c '\.dlq' <<< "$queues")" = 10 || { echo "::error::expected 10 dead-letter queues"; fail=1; }
          ! grep -vqE '\squorum\strue$' <<< "$queues" || { echo "::error::every queue must be a durable quorum queue"; fail=1; }
          test "$($ctl list_bindings source_name | grep -c '^farol\.')" = 37 || { echo "::error::expected 37 bindings"; fail=1; }
          expected=$(printf '%s\n' \
            'auth-users	^$	^(farol\.auth-users|farol\.dead-letters)$	^auth-users\..*' \
            'badges	^$	^farol\.dead-letters$	^badges\..*' \
            'events	^$	^(farol\.events|farol\.dead-letters)$	^events\..*' \
            'reports	^$	^(farol\.reports|farol\.dead-letters)$	^reports\..*' \
            'transports	^$	^farol\.dead-letters$	^transports\..*')
          actual=$($ctl list_permissions | tail -n +2 | grep -v "^$RABBITMQ_ADMIN_USER	" | sort)
          test "$actual" = "$expected" || { echo "::error::service permissions differ"; diff <(echo "$expected") <(echo "$actual"); fail=1; }
          test -z "$($ctl list_users | tail -n +2 | grep -v "^$RABBITMQ_ADMIN_USER	" | grep -v '\[\]$')" || { echo "::error::a service user has tags"; fail=1; }
          exit $fail
        env:
          RABBITMQ_ADMIN_USER: farol-admin
      - name: Check the identity set-up through Keycloak (ADR-006)
        run: python3 -I infra/tests/identity_smoke.py infra/.env.example
      # What every service (#190 to #194) relies on: from inside the network, the issuer is still the public URL
      # and the keys are on the internal address (spec #189, D4).
      - name: Check the issuer and the keys a service sees
        shell: bash
        run: |
          docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example exec -T reports \
            wget -q -O - http://keycloak:8080/realms/farol/.well-known/openid-configuration |
          python3 -I -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["issuer"] == "http://localhost:8180/realms/farol", d["issuer"]
          assert d["jwks_uri"] == "http://keycloak:8080/realms/farol/protocol/openid-connect/certs", d["jwks_uri"]
          print("issuer", d["issuer"], "jwks", d["jwks_uri"])'
      - name: Check that Reports validates Keycloak tokens and reaches its database (#194)
        run: python3 -I infra/tests/reports_smoke.py infra/.env.example
      - name: Check that Auth & Users validates Keycloak tokens and publishes its first event (#191)
        run: python3 -I infra/tests/auth_users_smoke.py infra/.env.example farol-ci
      - name: Check that only 127.0.0.1 is published and the new containers are hardened
        shell: bash
        run: |
          compose="docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example"
          for container in $($compose ps -q); do
            outside=$(docker port "$container" | grep -v -- '-> 127\.0\.0\.1:' || true)
            test -z "$outside" || { echo "::error::$(docker inspect -f '{{.Name}}' "$container") is published outside 127.0.0.1: $outside"; exit 1; }
          done
          test "$(docker port "$($compose ps -q keycloak)")" = "8080/tcp -> 127.0.0.1:8180" || { echo "::error::Keycloak must publish only 127.0.0.1:8180"; exit 1; }
          test -z "$(docker port "$($compose ps -q postgres)")" || { echo "::error::PostgreSQL is published"; exit 1; }
          for service in postgres keycloak; do
            settings=$(docker inspect "$($compose ps -q "$service")" --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}')
            test "$settings" = "true [ALL] [no-new-privileges:true]" || { echo "::error::$service hardening: $settings"; exit 1; }
          done
      - name: Check each service status through the gateway
        shell: bash
        run: |
          for service in auth-users events reports transports badges; do
            body=$(curl --fail --silent --show-error "http://127.0.0.1:8080/status/$service")
            test "$body" = "{\"service\":\"$service\",\"status\":\"ok\"}" || { echo "$service: $body"; exit 1; }
          done
      - name: Check the web app
        run: curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q "<title>Farol</title>"
      # #148: the optional observability profile on top of the same stack (the checks above ran without it)
      - name: Start the observability profile and check it (#148)
        shell: bash
        run: |
          compose="docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example --profile observability"
          $compose up -d --wait --wait-timeout 300 prometheus grafana
          python3 -I infra/tests/observability_smoke.py infra/.env.example farol-ci
          for service in prometheus grafana; do
            container=$($compose ps -q "$service")
            outside=$(docker port "$container" | grep -v -- '-> 127\.0\.0\.1:' || true)
            test -z "$outside" || { echo "::error::$service is published outside 127.0.0.1: $outside"; exit 1; }
            settings=$(docker inspect "$container" --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}}')
            test "$settings" = "true [ALL] [no-new-privileges:true]" || { echo "::error::$service hardening: $settings"; exit 1; }
          done
      - name: Show container logs on failure
        if: failure()
        run: docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example logs --no-color --tail=100
      - name: Stop the CI stack
        if: always()
        # --profile observability: without it, `down` leaves the Prometheus and Grafana containers running (#148)
        run: docker compose -p farol-ci -f infra/compose.yaml --env-file infra/.env.example --profile observability down --volumes --remove-orphans

  sonar:
    name: SonarQube Cloud
    # No secrets for fork or Dependabot code. Do not use pull_request_target.
    # Free-plan PR analysis targets main; tags/manual feature branches are excluded.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: Check SonarQube Cloud configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          missing=0
          for key in SONAR_ORGANIZATION SONAR_PROJECT_KEY SONAR_TOKEN; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing $key. Follow Docs/Technical/sonarqube-cloud.md before enabling this check."
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/reports/pom.xml
      - name: Cache SonarScanner packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Build, test and generate coverage
        run: mvn --batch-mode --no-transfer-progress -f backend/reports/pom.xml verify
      - name: Verify the coverage report exists
        run: test -s backend/reports/target/site/jacoco/jacoco.xml
      - name: Analyze and wait for the quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress -f backend/reports/pom.xml
          sonar:sonar
          -Dsonar.host.url=https://sonarcloud.io
          "-Dsonar.organization=$SONAR_ORGANIZATION"
          "-Dsonar.projectKey=$SONAR_PROJECT_KEY"
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300
