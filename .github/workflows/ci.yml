name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/reports/pom.xml
      - name: Build and run the HTTP test
        run: mvn --batch-mode --no-transfer-progress -f backend/reports/pom.xml verify
      - name: Build and start the container
        run: docker compose -p farol-ci -f infra/compose.yaml up --build -d --wait --wait-timeout 120
      - name: Check the container endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/status |
            python3 -c 'import json, sys; assert json.load(sys.stdin) == {"service": "reports", "status": "ok"}'
      - name: Create and read a synthetic help request
        shell: bash
        run: |
          python3 - <<'PYSMOKE'
          import json
          import urllib.request
          base = "http://127.0.0.1:8080"
          payload = json.dumps({"category": "Health", "description": "Synthetic CI exercise."}).encode()
          request = urllib.request.Request(base + "/api/v1/demo/help-requests", data=payload,
                                           headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 201
              assert response.headers["X-Demo-Mode"] == "true"
              location = response.headers["Location"]
              saved = json.load(response)
          assert saved["demo"] is True and saved["requesterId"] == "demo-participant"
          assert saved["status"] == "Submitted" and saved["triage"]["state"] == "NotTriaged"
          assert location == "/api/v1/demo/help-requests/" + saved["id"]
          with urllib.request.urlopen(base + location, timeout=10) as response:
              assert response.status == 200 and json.load(response) == saved
          PYSMOKE
      - name: Check Swagger UI and the handwritten contract
        shell: bash
        run: |
          curl --fail --silent --show-error --location http://127.0.0.1:8080/swagger-ui.html > /tmp/swagger-ui.html
          grep -q 'Swagger UI' /tmp/swagger-ui.html
          curl --fail --silent --show-error http://127.0.0.1:8080/openapi.yaml > /tmp/openapi.yaml
          cmp backend/reports/contracts/openapi.yaml /tmp/openapi.yaml
      - name: Show container logs on failure
        if: failure()
        run: docker compose -p farol-ci -f infra/compose.yaml logs --no-color --tail=100
      - name: Stop the CI container
        if: always()
        run: docker compose -p farol-ci -f infra/compose.yaml down --remove-orphans
