<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="1268" viewBox="0 0 1004 1268" role="img" aria-labelledby="title desc">
<title id="title">Entrar num evento</title><desc id="desc">Sessão necessária, A carregar, Publicado, Rascunho, Suspenso, Encerrado, Link inválido, Erro de ligação</desc>
<style>text{font-family:system-ui,-apple-system,Arial,sans-serif;fill:#19324a}.page{font-size:27px;font-weight:720}.subtitle{font-size:14px;fill:#49627a}.variant{font-size:15px;font-weight:720}.brand{fill:white;font-size:17px;font-weight:720}.headline{font-size:19px;font-weight:730}.body{font-size:14px;fill:#38536c}.chip{font-size:13px;font-weight:700}.action{font-size:14px;fill:white;font-weight:650}</style>
<rect width="100%" height="100%" fill="#edf3f7"/>
<text x="32" y="44" class="page">Entrar num evento</text>
<text x="32" y="68" class="subtitle">US-12 · Estados da página aberta pelo QR ou pelo link</text>
<g transform="translate(32,91)"><text x="2" y="17" class="variant">Sessão necessária</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Entrar no evento</text><text x="22" y="148" class="body">Inicia sessão para continuar.</text><text x="22" y="169" class="body">O link fica guardado enquanto</text><text x="22" y="190" class="body">inicias sessão.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Iniciar sessão</text></g>
<g transform="translate(356,91)"><text x="2" y="17" class="variant">A carregar</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">A abrir o evento</text><rect x="22" y="130" width="87" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">A validar</text><text x="22" y="180" class="body">Estamos a verificar o link</text><text x="22" y="201" class="body">e a tua adesão.</text></g>
<g transform="translate(680,91)"><text x="2" y="17" class="variant">Publicado</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Queima do Porto</text><rect x="22" y="130" width="136" height="27" rx="13" fill="#e0f1e7"/><text x="33" y="148" class="chip" fill="#215843">Adesão concluída</text><text x="22" y="180" class="body">Já fazes parte do evento.</text><text x="22" y="201" class="body">Podes consultar o mapa.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Abrir evento</text></g>
<g transform="translate(32,483)"><text x="2" y="17" class="variant">Rascunho</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Evento indisponível</text><text x="22" y="148" class="body">Este link não permite entrar</text><text x="22" y="169" class="body">no evento neste momento.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Voltar aos meus eventos</text></g>
<g transform="translate(356,483)"><text x="2" y="17" class="variant">Suspenso</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Evento indisponível</text><text x="22" y="148" class="body">Este link não permite entrar</text><text x="22" y="169" class="body">no evento neste momento.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Voltar aos meus eventos</text></g>
<g transform="translate(680,483)"><text x="2" y="17" class="variant">Encerrado</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Evento indisponível</text><text x="22" y="148" class="body">Este link não permite entrar</text><text x="22" y="169" class="body">no evento neste momento.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Voltar aos meus eventos</text></g>
<g transform="translate(32,875)"><text x="2" y="17" class="variant">Link inválido</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Evento indisponível</text><text x="22" y="148" class="body">Pede um link atualizado</text><text x="22" y="169" class="body">à organização.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Voltar aos meus eventos</text></g>
<g transform="translate(356,875)"><text x="2" y="17" class="variant">Erro de ligação</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Sem ligação</text><text x="22" y="148" class="body">O evento não foi aberto.</text><text x="22" y="169" class="body">Tenta novamente.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Tentar novamente</text></g></svg>
