<text x="32" y="44" class="page">Acompanhar um pedido de ajuda</text>
<text x="32" y="68" class="subtitle">US-24 · Visão do participante com o último estado e a hora</text>
<g transform="translate(32,91)"><text x="2" y="17" class="variant">Sem pedidos</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Os meus pedidos</text><text x="22" y="148" class="body">Ainda não tens pedidos de ajuda.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Ver planta do recinto</text></g>
<g transform="translate(356,91)"><text x="2" y="17" class="variant">A carregar</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Os meus pedidos</text><rect x="22" y="130" width="94" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">A carregar</text><text x="22" y="180" class="body">Estamos a consultar o teu pedido.</text></g>
<g transform="translate(680,91)"><text x="2" y="17" class="variant">Erro de ligação</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Os meus pedidos</text><text x="22" y="148" class="body">Não conseguimos atualizar o estado.</text><text x="22" y="169" class="body">Volta a tentar para ver o último estado.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Tentar novamente</text></g>
<g transform="translate(32,483)"><text x="2" y="17" class="variant">Submitted</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido FAR-024</text><rect x="22" y="130" width="73" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">Enviado</text><text x="22" y="180" class="body">Uma pessoa sente-se mal.</text><text x="22" y="201" class="body">Última atualização às 21h04.</text></g>
<g transform="translate(356,483)"><text x="2" y="17" class="variant">Seen</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido FAR-024</text><rect x="22" y="130" width="59" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">Visto</text><text x="22" y="180" class="body">A equipa viu o teu pedido.</text><text x="22" y="201" class="body">Última atualização às 21h05.</text></g>
<g transform="translate(680,483)"><text x="2" y="17" class="variant">OnTheWay</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido FAR-024</text><rect x="22" y="130" width="87" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">A caminho</text><text x="22" y="180" class="body">Uma equipa vai ter contigo.</text><text x="22" y="201" class="body">Última atualização às 21h06.</text></g>
<g transform="translate(32,875)"><text x="2" y="17" class="variant">Resolved</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido FAR-024</text><rect x="22" y="130" width="87" height="27" rx="13" fill="#e0f1e7"/><text x="33" y="148" class="chip" fill="#215843">Resolvido</text><text x="22" y="180" class="body">A equipa marcou o pedido resolvido.</text><text x="22" y="201" class="body">Última atualização às 21h12.</text></g>
<g transform="translate(356,875)"><text x="2" y="17" class="variant">Closed</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido FAR-024</text><rect x="22" y="130" width="87" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">Encerrado</text><text x="22" y="180" class="body">O teu pedido foi encerrado.</text><text x="22" y="201" class="body">Última atualização às 21h15.</text></g></svg>
