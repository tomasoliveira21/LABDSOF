<svg xmlns="http://www.w3.org/2000/svg" width="1004" height="1268" viewBox="0 0 1004 1268" role="img" aria-labelledby="title desc">
<title id="title">Pedir ajuda no mapa</title><desc id="desc">Formulário vazio, Ponto assinalado, Validação, Envio em curso, Confirmação, Erro de envio, Limite atingido</desc>
<style>text{font-family:system-ui,-apple-system,Arial,sans-serif;fill:#19324a}.page{font-size:27px;font-weight:720}.subtitle{font-size:14px;fill:#49627a}.variant{font-size:15px;font-weight:720}.brand{fill:white;font-size:17px;font-weight:720}.headline{font-size:19px;font-weight:730}.body{font-size:14px;fill:#38536c}.chip{font-size:13px;font-weight:700}.action{font-size:14px;fill:white;font-weight:650}</style>
<rect width="100%" height="100%" fill="#edf3f7"/>
<text x="32" y="44" class="page">Pedir ajuda no mapa</text>
<text x="32" y="68" class="subtitle">US-23 · Descrição, ponto, envio e limite de pedidos</text>
<g transform="translate(32,91)"><text x="2" y="17" class="variant">Formulário vazio</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedir ajuda</text><text x="22" y="148" class="body">Descreve o que aconteceu.</text><text x="22" y="169" class="body">Descrição (1 a 500 caracteres)</text><text x="22" y="190" class="body">Assinala a tua posição na planta.</text><rect x="22" y="205" width="246" height="107" rx="9" fill="#e6f0ed"/><g transform="translate(22,205)"><path d="M14 82H70L102 52H218 M102 52L117 18H174 M162 52V92" stroke="#fff" stroke-width="11" fill="none"/><rect x="18" y="13" width="63" height="33" rx="5" fill="#cbdde8"/><rect x="170" y="66" width="58" height="29" rx="5" fill="#d6e6d5"/><circle cx="62" cy="66" r="10" fill="#315f78"/><path d="M62 61v10m-5-5h10" stroke="#fff" stroke-width="2"/><circle cx="179" cy="29" r="8" fill="#796029"/><circle cx="143" cy="79" r="8" fill="#315f78"/></g><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Assinalar a localização</text></g>
<g transform="translate(356,91)"><text x="2" y="17" class="variant">Ponto assinalado</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedir ajuda</text><text x="22" y="148" class="body">“Uma pessoa sente-se mal.”</text><text x="22" y="169" class="body">Confirma a posição antes de enviar.</text><rect x="22" y="190" width="246" height="107" rx="9" fill="#e6f0ed"/><g transform="translate(22,190)"><path d="M14 82H70L102 52H218 M102 52L117 18H174 M162 52V92" stroke="#fff" stroke-width="11" fill="none"/><rect x="18" y="13" width="63" height="33" rx="5" fill="#cbdde8"/><rect x="170" y="66" width="58" height="29" rx="5" fill="#d6e6d5"/><circle cx="62" cy="66" r="10" fill="#315f78"/><path d="M62 61v10m-5-5h10" stroke="#fff" stroke-width="2"/><circle cx="179" cy="29" r="8" fill="#796029"/><circle cx="143" cy="79" r="8" fill="#315f78"/><circle cx="105" cy="54" r="10" fill="#b3463b" stroke="white" stroke-width="2"/></g><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Enviar pedido</text></g>
<g transform="translate(680,91)"><text x="2" y="17" class="variant">Validação</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedir ajuda</text><rect x="22" y="130" width="164" height="27" rx="13" fill="#f8e8e4"/><text x="33" y="148" class="chip" fill="#85342e">Campos por preencher</text><text x="22" y="180" class="body">Escreve uma descrição até 500</text><text x="22" y="201" class="body">caracteres e assinala a tua posição.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Corrigir pedido</text></g>
<g transform="translate(32,483)"><text x="2" y="17" class="variant">Envio em curso</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">A enviar pedido</text><rect x="22" y="130" width="80" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">A enviar</text><text x="22" y="180" class="body">Estamos a registar o teu pedido.</text><text x="22" y="201" class="body">Aguarda a confirmação.</text></g>
<g transform="translate(356,483)"><text x="2" y="17" class="variant">Confirmação</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido enviado</text><rect x="22" y="130" width="73" height="27" rx="13" fill="#e0f1e7"/><text x="33" y="148" class="chip" fill="#215843">Enviado</text><text x="22" y="180" class="body">A equipa recebeu o pedido.</text><text x="22" y="201" class="body">Podes acompanhar o estado.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Acompanhar pedido</text></g>
<g transform="translate(680,483)"><text x="2" y="17" class="variant">Erro de envio</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Pedido por enviar</text><rect x="22" y="130" width="157" height="27" rx="13" fill="#f8e8e4"/><text x="33" y="148" class="chip" fill="#85342e">Envio por confirmar</text><text x="22" y="180" class="body">O texto e o ponto foram guardados</text><text x="22" y="201" class="body">neste ecrã. Tenta novamente.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Tentar novamente</text></g>
<g transform="translate(32,875)"><text x="2" y="17" class="variant">Limite atingido</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Limite de pedidos</text><text x="22" y="148" class="body">Podes tentar novamente em 2 min.</text><text x="22" y="169" class="body">A planta mostra os postos de apoio.</text><rect x="22" y="190" width="246" height="107" rx="9" fill="#e6f0ed"/><g transform="translate(22,190)"><path d="M14 82H70L102 52H218 M102 52L117 18H174 M162 52V92" stroke="#fff" stroke-width="11" fill="none"/><rect x="18" y="13" width="63" height="33" rx="5" fill="#cbdde8"/><rect x="170" y="66" width="58" height="29" rx="5" fill="#d6e6d5"/><circle cx="62" cy="66" r="10" fill="#315f78"/><path d="M62 61v10m-5-5h10" stroke="#fff" stroke-width="2"/><circle cx="179" cy="29" r="8" fill="#796029"/><circle cx="143" cy="79" r="8" fill="#315f78"/><circle cx="105" cy="54" r="10" fill="#b3463b" stroke="white" stroke-width="2"/></g><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Ver primeiros socorros</text></g></svg>
