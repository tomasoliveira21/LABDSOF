<g transform="translate(32,483)"><text x="2" y="17" class="variant">Planta atualizada</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Mapa do recinto</text><text x="22" y="148" class="body">Estás a ver a última planta</text><text x="22" y="169" class="body">publicada pela organização.</text><rect x="22" y="190" width="246" height="107" rx="9" fill="#e6f0ed"/><g transform="translate(22,190)"><path d="M14 82H70L102 52H218 M102 52L117 18H174 M162 52V92" stroke="#fff" stroke-width="11" fill="none"/><rect x="18" y="13" width="63" height="33" rx="5" fill="#cbdde8"/><rect x="170" y="66" width="58" height="29" rx="5" fill="#d6e6d5"/><circle cx="62" cy="66" r="10" fill="#315f78"/><path d="M62 61v10m-5-5h10" stroke="#fff" stroke-width="2"/><circle cx="179" cy="29" r="8" fill="#796029"/><circle cx="143" cy="79" r="8" fill="#315f78"/><circle cx="105" cy="54" r="10" fill="#b3463b" stroke="white" stroke-width="2"/></g><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Ver pontos na planta</text></g>
<g transform="translate(356,483)"><text x="2" y="17" class="variant">Erro de ligação</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Mapa do recinto</text><text x="22" y="148" class="body">Não foi possível carregar a planta.</text><text x="22" y="169" class="body">Verifica a ligação e tenta de novo.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Tentar novamente</text></g></svg>
