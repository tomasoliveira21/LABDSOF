<text x="32" y="44" class="page">Consultar a planta do recinto</text>
<text x="32" y="68" class="subtitle">US-21 · Mapa no telemóvel e estados da versão publicada</text>
<g transform="translate(32,91)"><text x="2" y="17" class="variant">A carregar</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Mapa do recinto</text><rect x="22" y="130" width="94" height="27" rx="13" fill="#deedf5"/><text x="33" y="148" class="chip" fill="#234662">A carregar</text><text x="22" y="180" class="body">A carregar a planta e os pontos</text><text x="22" y="201" class="body">de referência.</text></g>
<g transform="translate(356,91)"><text x="2" y="17" class="variant">Sem planta</text><rect y="31" width="290" height="336" rx="18" fill="#fff" stroke="#c3d0db"/><path d="M1 49a17 17 0 0 1 17-17h254a17 17 0 0 1 17 17v35H1z" fill="#10243a"/><circle cx="25" cy="58" r="10" fill="#75b5d1"/><path d="M21 62l4-9 4 9" fill="none" stroke="#10243a" stroke-width="2"/><text x="44" y="64" class="brand">Farol</text><text x="22" y="117" class="headline">Mapa do recinto</text><text x="22" y="148" class="body">A organização ainda não</text><text x="22" y="169" class="body">publicou a planta do recinto.</text><rect x="22" y="309" width="246" height="40" rx="8" fill="#17374f"/><text x="36" y="334" class="action">Voltar ao evento</text></g>
